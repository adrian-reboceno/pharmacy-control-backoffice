<div class="presentations-page">

  <div class="page-header">
    <div>
      <h1 class="page-title">Presentaciones</h1>
      <nav class="breadcrumb">
        <span>PharmaControl</span>
        <mat-icon>chevron_right</mat-icon>
        <span>Catálogo</span>
        <mat-icon>chevron_right</mat-icon>
        <span class="bc-active">Presentaciones</span>
      </nav>
    </div>
    <button class="btn-primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      Nueva presentación
    </button>
  </div>

  <div class="filter-bar">
    <button class="filter-chip" [class.active]="filterActive() === undefined" (click)="setActive(undefined)">
      Todas
    </button>
    <button class="filter-chip" [class.active]="filterActive() === true" (click)="setActive(true)">
      Activas
    </button>
    <button class="filter-chip" [class.active]="filterActive() === false" (click)="setActive(false)">
      Inactivas
    </button>
  </div>

  <app-data-table
    [columns]="columns"
    [rows]="items()"
    [total]="total()"
    [loading]="loading()"
    (pageChange)="onPageChange($event)">

    <!-- Columna: Abreviatura -->
    <ng-template #abbrevTpl let-row>
      <span class="abbrev-badge">{{ row.abbreviation }}</span>
    </ng-template>

    <!-- Columna: Descripción -->
    <ng-template #descTpl let-row>
      @if (row.description) {
        <span class="desc-text" [title]="row.description">
          {{ row.description | slice:0:60 }}{{ row.description.length > 60 ? '…' : '' }}
        </span>
      } @else {
        <span class="text-muted">—</span>
      }
    </ng-template>

    <!-- Columna: Estado -->
    <ng-template #statusTpl let-row>
      <span class="status-badge" [class.inactive]="!row.is_active">
        {{ row.is_active ? 'Activa' : 'Inactiva' }}
      </span>
    </ng-template>

    <!-- Acciones -->
    <ng-template #actionsTemplate let-row>
      <div class="row-actions">
        <button class="icon-btn" matTooltip="Editar" (click)="openEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>
        @if (row.is_active) {
          <button class="icon-btn danger" matTooltip="Desactivar" (click)="deactivate(row)">
            <mat-icon>block</mat-icon>
          </button>
        }
      </div>
    </ng-template>

  </app-data-table>

</div>
